name: nuclei scan (reusable)

# Reusable DAST scan of a single live URL. Called by security-dast.yml.
# Template selection lives in .github/nuclei-config.yaml (curated for a
# Vercel-hosted Next.js app). This file owns the job plumbing: target
# injection, artifact upload, SARIF upload, and the severity gate.
#
# Upgrade note: migrated from nuclei-action v2 (deprecated March 2026) to v3.
# v3 uses `args` + `config-path` instead of the old `target`/`flags`/
# `*-export` inputs — see https://github.com/projectdiscovery/nuclei-action.

on:
  workflow_call:
    inputs:
      target:
        description: "Target URL to scan"
        required: true
        type: string
      fail-on:
        description: "Comma-separated severities that fail the job"
        required: false
        type: string
        default: "critical,high"

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Required so config-path (.github/nuclei-config.yaml) is resolvable.
      - uses: actions/checkout@v4

      - name: Compute target slug
        id: slug
        env:
          TARGET: ${{ inputs.target }}
        run: |
          slug=$(printf '%s' "$TARGET" | sed -E 's#^https?://##; s#[^A-Za-z0-9]+#-#g; s#-+$##')
          echo "value=$slug" >> "$GITHUB_OUTPUT"

      - name: Nuclei scan
        id: nuclei
        # Pinned to v3.1.0 (SHA) for supply-chain hygiene.
        # Template selection and output paths come from .github/nuclei-config.yaml.
        uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        with:
          args: -u ${{ inputs.target }}
          config-path: .github/nuclei-config.yaml

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('nuclei.sarif') != ''
        continue-on-error: true # no-op / permission error without GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: nuclei.sarif
          category: nuclei-${{ steps.slug.outputs.value }}

      - name: Upload raw findings artifact
        if: always() && (hashFiles('nuclei.json') != '' || hashFiles('nuclei-markdown/') != '')
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-${{ steps.slug.outputs.value }}
          path: |
            nuclei.json
            nuclei-markdown/
            nuclei.sarif
          if-no-files-found: ignore

      - name: Report + severity gate
        if: always()
        env:
          TARGET: ${{ inputs.target }}
          FAIL_ON: ${{ inputs.fail-on }}
        run: |
          echo "## Nuclei DAST — $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s nuclei.json ]; then
            echo "No findings. :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -d nuclei-markdown ] && [ -n "$(ls -A nuclei-markdown)" ]; then
            cat nuclei-markdown/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

          count=$(jq --arg fail "$FAIL_ON" \
            '($fail | split(",")) as $sev | [ .[] | select(.info.severity as $s | $sev | index($s)) ] | length' \
            nuclei.json)
          echo "**Blocking findings ($FAIL_ON): $count**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -gt 0 ]; then
            jq -r --arg fail "$FAIL_ON" \
              '($fail | split(",")) as $sev | .[] | select(.info.severity as $s | $sev | index($s)) | "- [" + .info.severity + "] " + .info.name' \
              nuclei.json
            echo "::error::$count blocking nuclei finding(s) at severity: $FAIL_ON on $TARGET"
            exit 1
          fi
