name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: personus
          POSTGRES_PASSWORD: personus
          POSTGRES_DB: personus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Enables the service-layer integration suite (harness skips without it).
      TEST_DATABASE_URL: postgresql://personus:personus@localhost:5432/personus_test

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Lint
        run: bunx @biomejs/biome check .
      - name: Test (unit + integration)
        run: bun run test
      - name: Coverage
        run: bun run test:coverage
