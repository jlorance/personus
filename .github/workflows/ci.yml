name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Lint
        run: bunx @biomejs/biome check .
      - name: Test
        run: bun run test
      - name: Coverage
        run: bun run test:coverage
